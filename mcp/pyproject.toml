[project]
name = "pob-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing Path of Building's calculation engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",
]

[project.scripts]
pob-mcp = "pob_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pob_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
